<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

</head>
<body>
<title>Trainingsbuch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column of stacked blocks, a fixed tab bar at the bottom. Black ground, white type, gold only for the active thing. */
:root{
  --bg:#0A0A09;
  --surface:#141311;
  --surface-2:#1D1B18;
  --line:#2C2924;
  --fg:#F6F4EF;
  --muted:#958E81;
  --gold:#C9A44C;
  --gold-soft:rgba(201,164,76,.14);
  --danger:#E07462;
  --display:'Barlow Condensed','Arial Narrow',sans-serif;
  --body:'Barlow',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:14px 170px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 18px}
.brand{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.brand b{color:var(--gold);font-weight:700}
.sync{white-space:nowrap;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;letter-spacing:.02em}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--gold)}

/* type */
h2{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
h2:first-child{margin-top:4px}
.hint,.empty{color:var(--muted);font-size:14px;margin:6px 0}
.empty{padding:18px 0}
.num{font-variant-numeric:tabular-nums}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 14px;min-height:44px;font-weight:600;font-size:15px}
.btn:hover{border-color:#4a453c}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#0A0A09}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:rgba(224,116,98,.4);background:transparent}
.btn.sm{min-height:36px;padding:6px 11px;font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.end{justify-content:flex-end}
.grow{flex:1 1 auto}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 13px;font-size:14px;font-weight:500;min-height:36px}
.chip.on{border-color:var(--gold);color:var(--gold);background:var(--gold-soft)}
.chip small{color:var(--muted);font-weight:400;margin-left:4px}

/* fields */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.in,select,textarea,input[type=date]{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;font-size:16px;width:100%}
textarea{min-height:84px;resize:vertical}
.in::placeholder,textarea::placeholder{color:#5f5a51}
.in:focus,select:focus,textarea:focus,input[type=date]:focus{border-color:var(--gold);outline:none}

/* plan starter */
.plans{display:grid;gap:8px}
.plan-btn{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.plan-btn:hover{border-color:var(--gold)}
.plan-btn strong{font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:.02em;display:block;line-height:1.1}
.plan-btn span{color:var(--muted);font-size:13px}
.plan-btn em{font-style:normal;color:var(--gold);font-size:13px;font-weight:600;white-space:nowrap}

/* draft */
.draft-head{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.draft-title{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:.02em;margin:0 0 12px;line-height:1.05}
.draft-title span{color:var(--gold)}
.exlist{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-top:14px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px}
.ex-head{display:flex;gap:8px;align-items:center}
.ex-name{flex:1 1 auto;min-width:0;width:0;background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 8px;font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:.01em}
.ex-name:focus{border-color:var(--line);background:var(--surface-2);outline:none}
.tools{display:flex;gap:4px;flex:none}
.ic{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:transparent;display:grid;place-items:center;color:var(--muted)}
.ic:hover{color:var(--fg);border-color:#4a453c}
.ic svg{width:16px;height:16px}
.ic:disabled{opacity:.3;cursor:default}
.last{font-size:13px;color:var(--muted);margin:2px 8px 8px}
.last b{color:var(--fg);font-weight:500}
.flags{display:flex;gap:6px;flex-wrap:wrap;margin:0 8px 8px}
.sets{display:grid;gap:6px}
.set,.set-head{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.set-head{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;padding-inline:0}
.set-head span:first-child{text-align:center}
.sn{font-family:var(--display);font-size:18px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.set .in{text-align:center;font-variant-numeric:tabular-nums;font-size:18px;font-weight:600;padding:8px}
.bw{display:grid;place-items:center;min-height:44px;border-radius:10px;border:1px dashed var(--line);color:var(--muted);font-size:13px}
.bw.w{border-style:solid;border-color:var(--gold);color:var(--gold)}
.cyc{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-weight:600;font-size:16px;color:#5f5a51}
.cyc.on{color:var(--fg)}
.ex-foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.addbox{margin-top:16px;background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:12px}
.addbox .row{flex-wrap:nowrap}
.addbox .chips{margin-top:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.actions .gold{flex:1 1 180px}

/* history */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.list{display:grid;gap:10px}
.s-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.s-date{font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:.02em}
.badge{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:600;white-space:nowrap}
.s-ex{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr);gap:2px 12px;font-size:14px}
.s-ex dt{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-ex dd{margin:0;font-variant-numeric:tabular-nums}
.tag{font-size:11px;border:1px solid var(--gold);color:var(--gold);border-radius:4px;padding:0 4px;margin-left:6px;letter-spacing:.04em;vertical-align:1px}
.note{margin:10px 0 0;font-size:14px;color:var(--fg);border-left:2px solid var(--line);padding-left:10px;white-space:pre-wrap}
.s-foot{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

/* progress */
.prog-ctrl{display:grid;gap:10px}
.readout{display:flex;align-items:baseline;gap:10px;margin:16px 0 6px}
.readout strong{font-family:var(--display);font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.readout span{color:var(--muted);font-size:14px}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:12px;font-family:var(--body)}
.chart .ln{fill:none;stroke:var(--gold);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--bg);stroke:var(--gold);stroke-width:2}
.chart .pt.sel{fill:var(--gold)}
.chart .pt.w{stroke:var(--fg)}
.chart .hit{fill:transparent;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .lbl{font-size:11px}
.stat b{display:block;font-family:var(--display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.stat b.up{color:var(--gold)}
.tbl-wrap{overflow-x:auto;margin-top:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:top}
td:first-child{white-space:nowrap;color:var(--muted)}

/* plans editor */
.pe-list{display:grid;gap:6px;margin:10px 0}
.pe-item{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:6px 6px 6px 12px}
.pe-item span{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pe-item i{font-style:normal;color:var(--muted);font-family:var(--display);width:18px}

/* import */
.imp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,11em);gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.imp small{display:block;color:var(--muted)}
.file{display:block;border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);cursor:pointer}
.file:hover{border-color:var(--gold);color:var(--fg)}
.file input{display:none}

/* confirm */
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(10,10,9,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{background:none;border:0;padding:14px 2px 15px;font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);position:relative}
.tab.on{color:var(--fg)}
.tab.on::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:2px;background:var(--gold)}
.dot{position:absolute;top:8px;right:24%;width:6px;height:6px;border-radius:50%;background:var(--gold)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(128px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:9;max-width:calc(100% - 32px)}

/* exercise header rows */
.ex-sub{display:flex;align-items:center;gap:6px;margin:2px 0 10px 8px}
.ex-sub .last{flex:1 1 auto;min-width:0;margin:0;font-size:13px;color:var(--muted)}
.ex-sub .ic{width:36px;height:36px}
/* rest timer */
.ex{position:relative;overflow:hidden;transition:background-color .3s,border-color .3s}
.ex.resting{background:#1C1810;border-color:rgba(201,164,76,.55)}
.ex.resting::before{content:"";position:absolute;left:0;top:0;height:4px;width:calc(var(--p,1)*100%);background:var(--gold);transition:width .25s linear}
.ex.rest-done{background:#33290F;border-color:var(--gold);animation:restPulse 1s ease-in-out 3}
@keyframes restPulse{50%{background:#4A3B14}}
.tpill{flex:none;min-width:52px;height:36px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;padding:0 10px}
.tpill.run{background:var(--gold);border-color:var(--gold);color:#0A0A09}
.tedit{margin:4px 8px 10px;padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.tval{font-family:var(--display);font-size:22px;min-width:3.2em;text-align:center}
.restbar{position:fixed;left:50%;transform:translateX(-50%);width:min(648px,calc(100% - 32px));bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 14px;border-radius:12px;border:1px solid var(--gold);color:var(--fg);overflow:hidden;
  background:linear-gradient(90deg,#3E331A calc(var(--p,0)*100%),#16130D calc(var(--p,0)*100%))}
.restbar[hidden],.toast[hidden]{display:none}
.restbar.done{background:var(--gold);color:#0A0A09}
.rb-name{flex:1 1 auto;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb-time{font-family:var(--display);font-size:26px;font-weight:700;line-height:1}
.rb-stop{border:1px solid currentColor;background:transparent;color:inherit;border-radius:8px;padding:6px 10px;font-weight:600;font-size:13px}
@media (prefers-reduced-motion:reduce){.ex.rest-done{animation:none}}
/* exercise hint */
.info-btn{border-radius:50%;font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:700;font-size:17px;line-height:1}
.info-btn.has{border-color:var(--gold);color:var(--gold)}
.info{margin:4px 8px 10px;padding:10px 12px;border-radius:10px;background:var(--gold-soft);border:1px solid rgba(201,164,76,.35);display:grid;grid-template-columns:minmax(0,1fr);gap:8px;min-width:0}
.info p{margin:0;white-space:pre-wrap;font-size:15px}
.info .link{justify-self:start;padding:0}
.info textarea{min-height:70px;min-width:0}
/* simple mode */
.links{display:flex;gap:18px;flex-wrap:wrap;margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
.link{background:none;border:0;padding:6px 0;color:var(--muted);font-size:14px;font-weight:500;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.link:hover{color:var(--fg)}
.back{margin-bottom:6px;text-decoration:none}
button.draft-title{background:none;border:0;padding:0;text-align:left;display:block;width:100%}
.draft-title small{display:block;font-family:var(--body);font-size:13px;font-weight:400;color:var(--muted);letter-spacing:0;margin-top:4px}
.ex-menu{display:flex;flex-wrap:wrap;gap:6px;margin:4px 8px 10px}
.ex-menu .btn:disabled{opacity:.35;cursor:default}
.s-sum{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:2px 12px;width:100%;background:none;border:0;padding:0;text-align:left}
.s-meta{grid-column:1;color:var(--muted);font-size:13px}
.s-sum .badge{grid-column:2;grid-row:1}
.card.open .s-sum{margin-bottom:12px}
.card{padding:12px 16px}
@media (max-width:420px){
  .s-ex{grid-template-columns:minmax(0,9em) minmax(0,1fr)}
  .tab{font-size:12.5px;letter-spacing:.05em}
  .stat b{font-size:20px}
  .imp{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">Trainings<b>buch</b></div>
    
  </header>
  <main id="view"><p class="empty">Lade deine Trainings …</p></main>
</div>
<nav class="tabs" aria-label="Bereiche"><div class="tabs-in" id="tabs"></div></nav>
<datalist id="exlist"></datalist>
<div id="restbar" class="restbar" hidden><span class="rb-name"></span><b class="rb-time num"></b><button class="rb-stop" data-act="stopRest">Stopp</button></div>
<div id="toast" class="toast" hidden></div>

<script src="dropbox-backup.js"></script>
<script>
(function(){
const UNITS=['Bauch','Unterer Rücken','Pull','Push','Beine'];
const SLUG={'Bauch':'bauch','Unterer Rücken':'ruecken','Pull':'pull','Push':'push','Beine':'beine'};
const TABS=[['log','Training'],['hist','Verlauf'],['prog','Fortschritt']];
const WESTE_KG=10;

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const num=v=>{const s=String(v??'').trim().replace(',','.');return /^\d+(\.\d+)?$/.test(s)?parseFloat(s):NaN};
const pad=n=>String(n).padStart(2,'0');
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const parseISO=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const fmtLong=s=>parseISO(s).toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'});
const fmtDay=s=>parseISO(s).toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'});
const fmtShort=s=>{const p=String(s).split('-');return `${p[2]}.${p[1]}.`};
const daysAgo=s=>Math.round((parseISO(todayISO())-parseISO(s))/864e5);
const agoText=n=>n<=0?'heute':n===1?'gestern':`vor ${n} T.`;
const fmtNum=v=>Number.isInteger(v)?String(v):v.toFixed(1).replace('.',',');
const LS={get(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const ICON={
  up:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3.5 10l4.5-4.5 4.5 4.5"/></svg>',
  down:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3.5 6l4.5 4.5L12.5 6"/></svg>',
  more:'<svg viewBox="0 0 16 16" fill="currentColor"><circle cx="3.5" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="12.5" cy="8" r="1.4"/></svg>',
  x:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4l8 8M12 4l-8 8"/></svg>'
};

const S={
  sessions:new Map(), plans:new Map(), backend:'loading', loaded:{s:false,p:false},
  tab:LS.get('tb_tab','log'), histFilter:'Alle', progEx:LS.get('tb_progEx',null), progMetric:null, progSel:null,
  draft:LS.get('tb_draft',null), planEdit:null, exInfo:{}, rest:{}, timerOpen:null, vibOK:null, infoOpen:null, infoEdit:false, exMenu:null, showMeta:false, showNote:false, openSess:null, showTbl:false, confirm:null, imports:[], exportText:null, busy:false
};
let db=null, downloads=null;

/* ---------- storage ---------- */
async function withRetry(fn){try{return await fn()}catch(e){if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,400+Math.random()*600));return fn()}throw e}}
function errMsg(e){if(!e)return 'Unbekannter Fehler';if(e.code==='quota_exceeded')return 'Speicher voll.';if(e.code==='invalid_argument')return 'Keine Schreibrechte für dieses Trainingsbuch.';return e.message||String(e.code||e)}
function persistLocal(){LS.set('tb_sessions',Object.fromEntries(S.sessions));LS.set('tb_plans',Object.fromEntries(S.plans))}
async function putDoc(coll,id,doc){
  const map=coll==='sessions'?S.sessions:S.plans;
  map.set(id,doc);
  if(S.backend==='db'){await withRetry(()=>db.doc(coll+'/'+id).set(doc))}
  else persistLocal();
}
async function delDoc(coll,id){
  const map=coll==='sessions'?S.sessions:S.plans;
  map.delete(id);
  if(S.backend==='db'){await withRetry(()=>db.doc(coll+'/'+id).delete())}
  else persistLocal();
}
async function initStore(){
  let d=null;
  try{d=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){d=null}
  try{downloads=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){downloads=null}
  if(d){
    db=d;S.backend='db';
    const sub=(coll,key)=>db.collection(coll).onSnapshot(snap=>{
      const m=new Map();snap.docs.forEach(x=>m.set(x.id,x.data()));
      if(coll==='sessions')S.sessions=m;else S.plans=m;
      S.loaded[key]=true;softRender();
    },err=>{toast('Verbindung unterbrochen. Lade die Seite neu.');});
    sub('sessions','s');sub('plans','p');
    db.doc('meta/rest').onSnapshot(snap=>{const d=snap.exists?snap.data():null;if(!restPending)S.rest=Object.assign({},d&&d.secs||{});softRender()},()=>{});
    db.doc('meta/exinfo').onSnapshot(snap=>{const d=snap.exists?snap.data():null;S.exInfo=Object.assign({},d&&d.notes||{});softRender()},()=>{});
  }else{
    S.backend='local';
    let fresh=false;try{fresh=localStorage.getItem('tb_sessions')===null}catch(e){}
    if(fresh){try{const r=await fetch('seed.json',{cache:'no-store'});if(r.ok){const j=await r.json();LS.set('tb_sessions',j.sessions||{});LS.set('tb_plans',j.plans||{});LS.set('tb_exinfo',j.exinfo||{});LS.set('tb_rest',j.rest||{})}}catch(e){}}
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
    S.sessions=new Map(Object.entries(LS.get('tb_sessions',{})));
    S.plans=new Map(Object.entries(LS.get('tb_plans',{})));
    S.exInfo=LS.get('tb_exinfo',{});
    S.rest=LS.get('tb_rest',{});
    S.loaded={s:true,p:true};
  }
  render();
}

/* ---------- rest timer ---------- */
const REST_DEFAULT=90;
let restPending=null,T=null,wakeLock=null;
const restFor=name=>{const v=S.rest[name];return typeof v==='number'?v:REST_DEFAULT};
const fmtSec=sec=>sec<=0?'Aus':`${Math.floor(sec/60)}:${pad(sec%60)}`;
function setRest(name,sec){
  sec=Math.max(0,Math.min(600,Math.round(sec)));
  S.rest=Object.assign({},S.rest,{[name]:sec});
  if(S.backend==='db'){clearTimeout(restPending);restPending=setTimeout(async()=>{restPending=null;try{await withRetry(()=>db.doc('meta/rest').set({secs:S.rest}))}catch(e){toast('Timer nicht gespeichert: '+errMsg(e))}},700)}
  else LS.set('tb_rest',S.rest);
}
async function wake(){try{if(!wakeLock&&navigator.wakeLock)wakeLock=await navigator.wakeLock.request('screen')}catch(e){wakeLock=null}}
function unwake(){try{wakeLock&&wakeLock.release()}catch(e){}wakeLock=null}
/* ---------- Android-App: Pausenende auch bei gesperrtem Handy (nur in der APK aktiv) ---------- */
const LN=()=>{try{return (window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications)||null}catch(e){return null}};
let lnReady=false;
async function lnSetup(ln){
  if(lnReady)return true;
  try{
    let p=await ln.checkPermissions();
    if(p.display!=='granted')p=await ln.requestPermissions();
    if(p.display!=='granted'){toast('Benachrichtigungen sind aus. Erlaube sie in den Android-Einstellungen für die App.');return false}
    await ln.createChannel({id:'pause2',name:'Pausentimer',description:'Meldet das Ende der Pause per Vibration',importance:4,visibility:1,vibration:true,sound:'silent.wav'});
    lnReady=true;return true;
  }catch(e){return false}
}
async function lnSchedule(endMs,name){
  const ln=LN();if(!ln)return;
  try{
    if(!await lnSetup(ln))return;
    await ln.cancel({notifications:[{id:1},{id:2},{id:3}]});
    const mk=(id,off)=>({id,title:'Pause vorbei',body:name,channelId:'pause2',sound:'silent.wav',schedule:{at:new Date(endMs+off),allowWhileIdle:true}});
    await ln.schedule({notifications:[mk(1,0),mk(2,2500),mk(3,5000)]});
  }catch(e){}
}
function lnCancel(){const ln=LN();if(!ln)return;try{ln.cancel({notifications:[{id:1},{id:2},{id:3}]}).catch(()=>{});ln.removeAllDeliveredNotifications().catch(()=>{})}catch(e){}}
function startRest(ei,si){
  if(!S.draft)return;const e=S.draft.exercises[ei];if(!e)return;
  const dur=restFor(e.name);if(!dur)return;
  T={name:e.name,si,dur,end:Date.now()+dur*1000,done:false,buzzed:0};wake();buzz(30);lnSchedule(T.end,e.name);paintRest();
}
function lastFilledSet(e){let k=0;(e.sets||[]).forEach((st,j)=>{if(String(st.r||'').trim()||String(st.w||'').trim())k=j});return k}
function buzz(p){try{if(navigator.vibrate)return navigator.vibrate(p)}catch(e){}return false}
function stopRest(){T=null;unwake();lnCancel();paintRest()}
function tickRest(){
  if(!T)return;
  const left=T.end-Date.now();
  if(left<-20000){stopRest();return}
  if(left<=0&&!T.done){T.done=true;T.doneAt=Date.now();T.buzzed=1;buzz([500,200,500,200,500])}
  if(T.done){const since=Date.now()-T.doneAt;
    if(T.buzzed===1&&since>3000){T.buzzed=2;buzz([500,200,500,200,500])}
    else if(T.buzzed===2&&since>6000){T.buzzed=3;buzz([500,200,500,200,500])}}
  if(T.done&&Date.now()-T.doneAt>9000){stopRest();return}
  paintRest();
}
function paintRest(){
  const bar=$('#restbar');
  const d=S.draft;
  document.querySelectorAll('.ex').forEach(c=>{
    c.classList.remove('resting','rest-done');
    const e=d&&d.exercises[+c.dataset.ei];const pill=c.querySelector('.tpill');
    if(!e||!pill)return;
    const sb=c.querySelector('.rest-start');if(sb)sb.textContent=(T&&T.name===e.name&&!T.done)?'■ Pause stoppen':'▶ Pause starten';
    if(T&&T.name===e.name&&S.tab==='log'){
      const left=Math.max(0,Math.ceil((T.end-Date.now())/1000));
      c.classList.add(T.done?'rest-done':'resting');c.style.setProperty('--p',T.done?0:left/T.dur);
      pill.textContent=T.done?'Los!':fmtSec(left);pill.classList.add('run');
    }else{pill.textContent=fmtSec(restFor(e.name));pill.classList.remove('run')}
  });
  if(!T||!d){bar.hidden=true;return}
  const left=Math.max(0,Math.ceil((T.end-Date.now())/1000));
  bar.hidden=false;bar.classList.toggle('done',T.done);bar.style.setProperty('--p',T.done?1:1-left/T.dur);
  bar.querySelector('.rb-name').textContent=T.done?'Pause vorbei · '+T.name:'Pause · '+T.name+' · Satz '+(T.si+1);
  bar.querySelector('.rb-time').textContent=T.done?'Los!':fmtSec(left);
}
setInterval(tickRest,250);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tickRest();if(T&&!T.done)wake()}});

/* ---------- derived data ---------- */
function sessionsDesc(){return [...S.sessions].map(([id,s])=>Object.assign({id},s)).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(b.updatedAt||0)-(a.updatedAt||0))}
function plansSorted(){return [...S.plans].map(([id,p])=>Object.assign({id},p)).sort((a,b)=>UNITS.indexOf(a.unit)-UNITS.indexOf(b.unit)||(a.order??99)-(b.order??99)||String(a.name).localeCompare(b.name))}
function lastFor(name,excludeId,beforeDate){
  for(const s of sessionsDesc()){
    if(s.id===excludeId)continue;
    if(beforeDate&&s.date>beforeDate)continue;
    const ex=(s.exercises||[]).find(e=>e.name===name);
    if(ex)return {date:s.date,ex};
  }
  return null;
}
function weightKinds(name){
  let numeric=false,seen=false;const text=new Set();
  for(const s of S.sessions.values())for(const e of s.exercises||[])if(e.name===name){seen=true;for(const st of e.sets||[]){const w=String(st.w??'').trim();if(!w)continue;if(!isNaN(num(w)))numeric=true;else text.add(w)}}
  return {seen,numeric,text:[...text].sort()};
}
function catalog(unit){
  const c=new Map();
  for(const s of S.sessions.values())if(!unit||s.unit===unit)for(const e of s.exercises||[])c.set(e.name,(c.get(e.name)||0)+1);
  for(const p of S.plans.values())if(!unit||p.unit===unit)for(const n of p.exercises||[])c.set(n,(c.get(n)||0)+1);
  return [...c].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).map(x=>x[0]);
}
function unitOf(name){
  const c=new Map();
  for(const s of S.sessions.values())for(const e of s.exercises||[])if(e.name===name)c.set(s.unit,(c.get(s.unit)||0)+1);
  for(const p of S.plans.values())if((p.exercises||[]).includes(name))c.set(p.unit,(c.get(p.unit)||0)+1);
  let best='Sonstige',n=0;for(const[u,k]of c)if(k>n){best=u;n=k}return best;
}
function setStr(st){
  const w=String(st.w??'').trim(),r=String(st.r??'').trim()||'–';
  if(!w)return r;
  return isNaN(num(w))?`${w} ${r}`:`${w}×${r}`;
}

async function commitDraft(){
  const d=S.draft;if(!d||S.busy)return;

    .filter(e=>e.name&&e.sets.length);

  S.busy=false;S.draft=null;T=null;unwake();lnCancel();persistDraft();S.tab='hist';S.histFilter='Alle';S.openSess=id;toast('Training gespeichert');render();window.scrollTo(0,0);
}

const METRICS={

function niceTicks(min,max,n){
  if(min===max){min=min-1;max=max+1}
  const step0=(max-min)/n,mag=Math.pow(10,Math.floor(Math.log10(step0))),norm=step0/mag;
  const step=(norm<=1?1:norm<=2?2:norm<=2.5?2.5:norm<=5?5:10)*mag;
  const lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step,out=[];
  for(let v=lo;v<=hi+step/2;v+=step)out.push(+v.toFixed(6));
  return out;
}
function chartSVG(pts,unit){
  const vw=($('#view')&&$('#view').clientWidth)||360;const W=Math.round(Math.max(300,Math.min(680,vw))),H=Math.round(W<480?220:260),P={l:40,r:14,t:12,b:28};
  const xs=pts.map(p=>parseISO(p.date).getTime());
  let x0=Math.min(...xs),x1=Math.max(...xs);if(x0===x1){x0-=3*864e5;x1+=3*864e5}
  const ticks=niceTicks(Math.min(...pts.map(p=>p.v)),Math.max(...pts.map(p=>p.v)),4);
  const y0=ticks[0],y1=ticks[ticks.length-1];
  const X=t=>P.l+(t-x0)/(x1-x0)*(W-P.l-P.r),Y=v=>P.t+(1-(v-y0)/(y1-y0))*(H-P.t-P.b);
  const line=pts.map((p,i)=>`${i?'L':'M'}${X(xs[i]).toFixed(1)},${Y(p.v).toFixed(1)}`).join('');
  const area=`${line}L${X(xs[xs.length-1]).toFixed(1)},${Y(y0)}L${X(xs[0]).toFixed(1)},${Y(y0)}Z`;
  const every=Math.max(1,Math.ceil(pts.length/(W<480?4:6)));
  const xl=pts.map((p,i)=>{if(i%every&&i!==pts.length-1)return '';if(i!==pts.length-1&&pts.length-1-i<every&&i%every===0&&i!==0)return '';const x=X(xs[i]);const a=x<P.l+24?'start':x>W-P.r-24?'end':'middle';return `<text class="ax" x="${x.toFixed(1)}" y="${H-8}" text-anchor="${a}">${esc(fmtShort(p.date))}</text>`}).join('');
  const sel=S.progSel==null||S.progSel>=pts.length?pts.length-1:S.progSel;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlauf in ${esc(unit)}">
    <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--gold)" stop-opacity=".28"/><stop offset="1" stop-color="var(--gold)" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(v=>`<line class="grid" x1="${P.l}" x2="${W-P.r}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text class="ax" x="${P.l-8}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end">${esc(fmtNum(v))}</text>`).join('')}
    <path d="${area}" fill="url(#ga)"/>
    <path class="ln" d="${line}"/>
    ${pts.map((p,i)=>`<circle class="pt ${i===sel?'sel':''} ${p.weste?'w':''}" cx="${X(xs[i]).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${i===sel?6:4.5}"/>`).join('')}
    ${pts.map((p,i)=>`<circle class="hit" data-act="progSel" data-i="${i}" cx="${X(xs[i]).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="16"><title>${esc(fmtShort(p.date))}: ${esc(fmtNum(p.v))} ${esc(unit)}</title></circle>`).join('')}
    ${xl}
  </svg>`;
}

/* ---------- data: import / export ---------- */
function splitCSVLine(line,delim){
  const out=[];let cur='',q=false;
  for(let i=0;i<line.length;i++){const c=line[i];
    if(q){if(c==='"'){if(line[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;else if(c===delim){out.push(cur);cur=''}else cur+=c}
  out.push(cur);return out.map(s=>s.trim());
}
function normKey(k){return k.toLowerCase().replace(/^﻿/,'').replace('ü','ue').replace(/[^a-z_]/g,'')}
const KEYMAP={datum:'date',date:'date',uebung:'ex',exercise:'ex',satz:'set',gewicht_kg:'w',gewicht:'w',kg:'w',wiederholungen:'r',wdh:'r',reps:'r',einheit:'unit',trainingseinheit:'unit',weste:'weste',griffe:'griffe',pushupgriffe:'griffe',notiz:'note',notizen:'note'};
function parseDate(s){
  s=String(s).trim();let m;
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  if(m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})?$/)){let y=m[3]?(m[3].length===2?'20'+m[3]:m[3]):String(new Date().getFullYear());return `${y}-${pad(m[2])}-${pad(m[1])}`}
  return null;
}
function parseCSV(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length)return {rows:[],hasUnit:false,error:'Datei ist leer.'};
  const delim=(lines[0].split(';').length>=lines[0].split(',').length)?';':',';
  const head=splitCSVLine(lines[0],delim).map(h=>KEYMAP[normKey(h)]||null);
  if(!head.includes('date')||!head.includes('ex'))return {rows:[],hasUnit:false,error:'Spalten „Datum“ und „Übung“ fehlen.'};
  const rows=[];
  for(const l of lines.slice(1)){const c=splitCSVLine(l,delim);const r={};head.forEach((k,i)=>{if(k)r[k]=c[i]??''});
    r.date=parseDate(r.date);if(!r.date||!String(r.ex||'').trim())continue;rows.push(r)}
  return {rows,hasUnit:head.includes('unit')};
}
function guessUnit(fn){fn=fn.toLowerCase();if(fn.includes('push'))return 'Push';if(fn.includes('pull'))return 'Pull';if(fn.includes('bein'))return 'Beine';if(fn.includes('bauch')||fn.includes('abs'))return 'Bauch';if(fn.includes('rueck')||fn.includes('rück'))return 'Unterer Rücken';return ''}
const truthy=v=>/^(1|ja|x|true|yes|j)$/i.test(String(v||'').trim());
function matchUnit(v){v=String(v||'').trim().toLowerCase();return UNITS.find(u=>u.toLowerCase()===v)||''}
async function runImport(){
  if(S.busy)return;
  const groups=new Map();
  for(const f of S.imports){
    for(const r of f.rows){
      const unit=(f.hasUnit&&matchUnit(r.unit))||f.unit;if(!unit)continue;
      const key=r.date+'|'+unit;
      if(!groups.has(key))groups.set(key,{date:r.date,unit,note:'',ex:new Map()});
      const g=groups.get(key);const name=String(r.ex).trim();
      if(!g.ex.has(name))g.ex.set(name,{name,weste:false,griffe:false,sets:[]});
      const e=g.ex.get(name);
      if(truthy(r.weste))e.weste=true;if(truthy(r.griffe))e.griffe=true;
      if(!g.note&&r.note)g.note=String(r.note).trim();
      if(String(r.w||'').trim()||String(r.r||'').trim())e.sets.push({w:String(r.w||'').trim(),r:String(r.r||'').trim()});
    }
  }
  if(!groups.size){toast('Nichts zu importieren. Wähle für jede Datei eine Einheit.');return}
  S.busy=true;let done=0,replaced=0;
  try{
    for(const g of groups.values()){
      let id=null;for(const[sid,s]of S.sessions)if(s.date===g.date&&s.unit===g.unit){id=sid;break}
      if(id){replaced++}else id=`${g.date}_${SLUG[g.unit]}`;
      const prev=S.sessions.get(id);
      await putDoc('sessions',id,{date:g.date,unit:g.unit,note:g.note||(prev&&prev.note)||'',exercises:[...g.ex.values()],updatedAt:Date.now()});
      done++;
    }
  }catch(e){S.busy=false;toast(`Abgebrochen nach ${done} Trainings: ${errMsg(e)}`);render();return}
  S.busy=false;S.imports=[];toast(`${done} Trainings importiert${replaced?`, ${replaced} ersetzt`:''}`);render();
}
function buildCSV(){
  const q=v=>{v=String(v??'');return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const out=['Datum;Einheit;Übung;Satz;Gewicht_kg;Wiederholungen;Weste;Griffe;Notiz'];
  for(const s of sessionsDesc().reverse())(s.exercises||[]).forEach((e,ei)=>(e.sets||[]).forEach((st,i)=>out.push([s.date,s.unit,e.name,i+1,st.w,st.r,e.weste?'ja':'',e.griffe?'ja':'',ei===0&&i===0?s.note||'':''].map(q).join(';'))));
  return out.join('\n')+'\n';
}
async function doExport(){
  const csv=buildCSV();
  if(downloads){
    try{await downloads.save({filename:`trainingsbuch-${todayISO()}.csv`,data:'﻿'+csv});toast('CSV gespeichert');return}
    catch(e){if(e&&e.code==='declined')return;}
  }
  const fname=`trainingsbuch-${todayISO()}.csv`;
  try{const file=new File(['\ufeff'+csv],fname,{type:'text/csv'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Trainingsbuch Backup'});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download=fname;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);toast('CSV gespeichert');return}catch(e){}
  S.exportText=csv;render();
}

    <div class="actions"><button class="btn gold" data-act="runImport" ${S.imports.some(f=>!f.hasUnit&&!f.unit&&f.rows.length)?'disabled style="opacity:.5"':''}>Importieren</button><button class="btn ghost" data-act="clearImport">Abbrechen</button></div></div>`:''}

    case 'startPlan':if(S.draft&&!S.draft.id&&S.draft.exercises.length){S.tab='log';render();toast('Es ist noch ein Training offen.');break}startDraft(null,b.dataset.id);break;
    case 'startUnit':startDraft(b.dataset.unit,null);break;
    case 'addEx':{const i=$('#addEx');addExToDraft(i&&i.value);break}
    case 'addExName':addExToDraft(b.dataset.name);break;
    case 'restStart':{const e=d&&d.exercises[ei];if(!e)break;
      if(T&&T.name===e.name&&!T.done){stopRest();break}
      if(!restFor(e.name)){toast('Pause ist auf „Aus“. Stell oben beim Zeitfeld eine Zeit ein.');break}
      startRest(ei,lastFilledSet(e));break}
    case 'addSet':d.exercises[ei].sets.push({w:'',r:''});persistDraft();render();break;
    case 'timerEdit':S.timerOpen=S.timerOpen===ei?null:ei;S.infoOpen=null;S.exMenu=null;render();break;
    case 'timerClose':S.timerOpen=null;render();break;
    case 'restSet':case 'restStep':{const e=d.exercises[ei];const v=a==='restSet'?+b.dataset.v:restFor(e.name)+(+b.dataset.v);setRest(e.name,v);
      if(S.vibOK===null){try{S.vibOK=navigator.vibrate?navigator.vibrate(40):false}catch(x){S.vibOK=false}}else{try{navigator.vibrate&&navigator.vibrate(40)}catch(x){}}
      render();break}
    case 'stopRest':stopRest();break;
    case 'info':S.timerOpen=null;S.infoOpen=S.infoOpen===ei?null:ei;S.infoEdit=false;render();if(S.infoOpen===ei&&!S.exInfo[d.exercises[ei].name]){const t=$('#infoText');if(t)t.focus()}break;
    case 'infoEditOn':S.infoEdit=true;render();{const t=$('#infoText');if(t)t.focus()}break;
    case 'infoClose':S.infoOpen=null;S.infoEdit=false;render();break;
    case 'infoSave':{const t=$('#infoText');try{await saveInfo(d.exercises[ei].name,t?t.value:'');S.infoEdit=false;if(!S.exInfo[d.exercises[ei].name])S.infoOpen=null;toast('Hinweis gespeichert')}catch(e){toast('Nicht gespeichert: '+errMsg(e))}render();break}
    case 'popSet':d.exercises[ei].sets.pop();persistDraft();render();break;
    case 'exMenu':S.timerOpen=null;S.exMenu=S.exMenu===ei?null:ei;S.confirm=null;render();break;
    case 'toggleMeta':S.showMeta=!S.showMeta;render();break;
    case 'showNote':S.showNote=true;render();{const t=$('#dNote');if(t)t.focus()}break;
    case 'openSess':S.openSess=S.openSess===b.dataset.id?null:b.dataset.id;S.confirm=null;render();break;
    case 'showTbl':S.showTbl=true;render();break;
    case 'cyc':{const e=d.exercises[ei];const vals=['',...weightKinds(e.name).text];const cur=vals.indexOf(e.sets[si].w);e.sets[si].w=vals[(cur+1)%vals.length];persistDraft();
      b.textContent=e.sets[si].w||'wählen';b.classList.toggle('on',!!e.sets[si].w);break}
    case 'flag':{const e=d.exercises[ei];e[b.dataset.k]=!e[b.dataset.k];persistDraft();render();break}
    case 'copyW':{const e=d.exercises[ei];const last=lastFor(e.name,d.id,d.date);if(!last)break;
      last.ex.sets.forEach((s,j)=>{if(!e.sets[j])e.sets.push({w:'',r:''});e.sets[j].w=s.w||''});persistDraft();render();break}
    case 'up':case 'down':{const j=a==='up'?ei-1:ei+1;if(j<0||j>=d.exercises.length)break;const t=d.exercises[ei];d.exercises[ei]=d.exercises[j];d.exercises[j]=t;S.exMenu=j;S.infoOpen=null;persistDraft();S.confirm=null;render();break}
    case 'delEx':S.confirm='delEx'+ei;render();break;
    case 'delExYes':d.exercises.splice(ei,1);S.confirm=null;S.exMenu=null;S.infoOpen=null;persistDraft();render();break;
    case 'save':await commitDraft();break;
    case 'discard':S.confirm='discard';render();break;
    case 'discardYes':{const wasEdit=d&&d.id;S.draft=null;T=null;unwake();lnCancel();S.confirm=null;persistDraft();if(wasEdit)S.tab='hist';render();break}
    case 'cancelConfirm':S.confirm=null;render();break;
    case 'histFilter':S.histFilter=b.dataset.unit;render();break;
    case 'edit':if(S.draft&&S.draft.id!==b.dataset.id&&(S.draft.exercises.length||S.draft.note)){S.confirm='edit:'+b.dataset.id;render();break}editSession(b.dataset.id);break;
    case 'editYes':editSession(b.dataset.id);break;
    case 'del':S.confirm='del:'+b.dataset.id;render();break;
    case 'delYes':try{await delDoc('sessions',b.dataset.id);toast('Training gelöscht')}catch(e){toast('Nicht gelöscht: '+errMsg(e))}S.confirm=null;render();break;
    case 'metric':S.progMetric=b.dataset.m;S.progSel=null;render();break;
    case 'progEx_':break;
    case 'progSel':S.progSel=+b.dataset.i;render();break;
    case 'newPlan':S.planEdit={id:null,name:'',unit:'Push',exercises:[]};render();break;
    case 'editPlan':{const p=S.plans.get(b.dataset.id);if(p){S.planEdit={id:b.dataset.id,name:p.name,unit:p.unit,order:p.order,exercises:[...(p.exercises||[])]};render()}break}
    case 'delPlan':S.confirm='plan:'+b.dataset.id;render();break;
    case 'delPlanYes':try{await delDoc('plans',b.dataset.id);toast('Plan gelöscht')}catch(e){toast('Nicht gelöscht: '+errMsg(e))}S.confirm=null;render();break;
    case 'peUp':case 'peDown':{const p=S.planEdit,i=+b.dataset.i,j=a==='peUp'?i-1:i+1;if(j<0||j>=p.exercises.length)break;[p.exercises[i],p.exercises[j]]=[p.exercises[j],p.exercises[i]];render();break}
    case 'peDel':S.planEdit.exercises.splice(+b.dataset.i,1);render();break;
    case 'peAdd':{const i=$('#peAdd');const n=i&&i.value.trim();if(n&&!S.planEdit.exercises.includes(n)){S.planEdit.exercises.push(n);render();const ni=$('#peAdd');if(ni)ni.focus()}break}
    case 'peAddName':if(!S.planEdit.exercises.includes(b.dataset.name)){S.planEdit.exercises.push(b.dataset.name);render()}break;
    case 'peSave':{const p=S.planEdit;const name=p.name.trim();if(!name){toast('Gib dem Plan einen Namen.');break}
      const id=p.id||('plan-'+Date.now().toString(36));
      try{await putDoc('plans',id,{name,unit:p.unit,exercises:p.exercises,order:p.order??Date.now()})}catch(e){toast('Nicht gespeichert: '+errMsg(e));break}
      S.planEdit=null;toast('Plan gespeichert');render();break}
    case 'peCancel':S.planEdit=null;render();break;
    case 'runImport':await runImport();break;
    case 'clearImport':S.imports=[];render();break;
    case 'export':await doExport();break;
    case 'copyExport':{const t=$('#expText');try{await navigator.clipboard.writeText(S.exportText);toast('Kopiert')}catch(e){if(t){t.focus();t.select()}toast('Text markiert. Jetzt kopieren.')}break}
  }
});
document.addEventListener('input',ev=>{
  const t=ev.target,d=S.draft;
  if(t.id==='dNote'&&d){d.note=t.value;persistDraft();return}
  if(t.id==='peName'&&S.planEdit){S.planEdit.name=t.value;return}
  if(d&&t.dataset.f&&t.dataset.ei!=null){
    const e=d.exercises[+t.dataset.ei];if(!e)return;
    if(t.dataset.f==='name'){e.name=t.value}else{e.sets[+t.dataset.si][t.dataset.f]=t.value}
    persistDraft();
  }
});
document.addEventListener('change',ev=>{
  const t=ev.target,d=S.draft;
  if(t.id==='dDate'&&d){d.date=t.value||todayISO();persistDraft();render()}
  else if(t.id==='dUnit'&&d){d.unit=t.value;persistDraft();render()}
  else if(t.dataset.f==='name'&&d){render()}
  else if(t.id==='progEx'){S.progEx=t.value;S.progSel=null;S.progMetric=null;LS.set('tb_progEx',t.value);render()}
  else if(t.id==='peUnit'&&S.planEdit){S.planEdit.unit=t.value;render()}
  else if(t.dataset.imp!=null){S.imports[+t.dataset.imp].unit=t.value;render()}
  else if(t.id==='csvIn'){
    const files=[...t.files];
    Promise.all(files.map(f=>f.text().then(text=>{const p=parseCSV(text);return {name:f.name,rows:p.rows,hasUnit:p.hasUnit,error:p.error,unit:guessUnit(f.name)}})))
      .then(list=>{S.imports=S.imports.concat(list);render()});
  }
});
document.addEventListener('keydown',ev=>{
  if(ev.key!=='Enter')return;
  if(ev.target.id==='addEx'){ev.preventDefault();addExToDraft(ev.target.value)}
  if(ev.target.id==='peAdd'){ev.preventDefault();const b=document.querySelector('[data-act="peAdd"]');if(b)b.click()}
});

render();
function dbxFiles(){
  return [
    {name:'trainingsbuch.csv',text:'\ufeff'+buildCSV()},
    {name:'trainingsbuch-komplett.json',text:JSON.stringify({app:'trainingsbuch',version:1,sessions:Object.fromEntries(S.sessions),plans:Object.fromEntries(S.plans),exinfo:S.exInfo,rest:S.rest},null,2)}
  ];
}
if(window.DropboxBackup)DropboxBackup.init({app:'trainingsbuch',files:dbxFiles,hasData:()=>S.loaded.s&&S.sessions.size>0,onUpdate:()=>{if(S.tab==='data'&&S.backend!=='loading')render()}});
initStore();
})();
</script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{})})}
</script>
