name: Angebote abrufen (Shopwise)

on:
  schedule:
    - cron: '30 6 * * 1'   # Montag früh: neue Prospektwoche
    - cron: '30 6 * * 4'   # Donnerstag früh: Aldi-Wechsel
  workflow_dispatch:
  push:
    paths:
      - 'shopwise-pwa/tools/fetch-angebote.mjs'
      - 'shopwise-pwa/data/suchbegriffe.json'
      - '.github/workflows/angebote.yml'

permissions:
  contents: write

concurrency:
  group: angebote
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Angebote holen
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node shopwise-pwa/tools/fetch-angebote.mjs
      - name: Speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shopwise-pwa/data/angebote.json
          if git diff --cached --quiet; then echo "Keine Änderung"; exit 0; fi
          git commit -m "Shopwise: Angebote aktualisiert"
          git pull --rebase origin main
          git push origin HEAD:main
